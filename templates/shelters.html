{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card shadow mb-3 border border-success">
            <div class="card-header bg-dark border-bottom border-secondary d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h5 class="mb-0 text-success">🛡️ Nationwide Public Storm Shelter Locator</h5>
                <div class="d-flex gap-2 align-items-center flex-wrap">
                    <input type="text" id="city-search" class="form-control form-control-sm" placeholder="Search City, State..." style="width: 180px;">
                    <button id="search-btn" class="btn btn-outline-success btn-sm">Search</button>
                    <button id="loc-btn" class="btn btn-success btn-sm fw-bold">📍 My GPS</button>
                    <button class="btn btn-outline-success btn-sm" data-bs-toggle="modal" data-bs-target="#shelterModal">➕ Register Shelter</button>
                </div>
            </div>
            <div class="card-body p-0">
                <div id="shelter-map" style="height: 600px; width: 100%; border-radius: 0 0 12px 12px;"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="shelterModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light border border-secondary shadow-lg">
      <div class="modal-header border-bottom border-secondary">
        <h5 class="modal-title text-success">Register Public Storm Shelter</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form action="/add_shelter" method="POST">
          <div class="modal-body">
              <div class="mb-3">
                  <label class="form-label text-light small fw-bold">Shelter / Facility Name</label>
                  <input type="text" class="form-control" name="name" placeholder="e.g. Community Safe Room" required>
              </div>
              <div class="row">
                  <div class="col-md-6 mb-3">
                      <label class="form-label text-light small fw-bold">Latitude</label>
                      <input type="text" class="form-control" name="lat" placeholder="e.g. 35.3395" required>
                  </div>
                  <div class="col-md-6 mb-3">
                      <label class="form-label text-light small fw-bold">Longitude</label>
                      <input type="text" class="form-control" name="lng" placeholder="e.g. -97.4868" required>
                  </div>
              </div>
              <div class="mb-3">
                  <label class="form-label text-light small fw-bold">City / Address</label>
                  <input type="text" class="form-control" name="address" placeholder="e.g. Moore, OK" required>
              </div>
              <div class="mb-3">
                  <label class="form-label text-light small fw-bold">Details / Access Info</label>
                  <input type="text" class="form-control" name="details" placeholder="e.g. Open 24/7 during severe weather warnings" required>
              </div>
          </div>
          <div class="modal-footer border-top border-secondary">
              <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-success btn-sm fw-bold">Save Shelter</button>
          </div>
      </form>
    </div>
  </div>
</div>

<script>
    const map = L.map('shelter-map').setView([38.5, -96.0], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let shelters = {{ shelters | tojson }};
    shelters.forEach(s => {
        L.marker([s.lat, s.lng]).addTo(map)
          .bindPopup('<b>🛡️ ' + s.name + '</b><br>' + s.address + '<br>' + s.details);
    });

    document.getElementById('search-btn').addEventListener('click', function() {
        const query = document.getElementById('city-search').value;
        if (!query) return;
        fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query))
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    map.setView([data[0].lat, data[0].lon], 8);
                } else {
                    alert('Location not found.');
                }
            });
    });

    document.getElementById('loc-btn').addEventListener('click', function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                map.setView([lat, lng], 10);
                L.marker([lat, lng]).addTo(map).bindPopup("📍 Your Live GPS Location").openPopup();
            }, function() {
                alert('Unable to retrieve your location.');
            });
        }
    });
</script>
{% endblock %}
