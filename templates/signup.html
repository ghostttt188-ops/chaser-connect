{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="card p-4 shadow-lg border border-warning">
            <h3 class="text-center text-warning mb-1 fw-bold">Create Chaser Account</h3>
            <p class="text-center text-light mb-3 small">Join the nationwide operational network</p>
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label text-light small fw-bold">Username / Team Name</label>
                    <input type="text" class="form-control" name="username" placeholder="e.g. VGRT_Leader" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-light small fw-bold">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Create password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-light small fw-bold">Chaser Bio / Target Regions</label>
                    <input type="text" class="form-control" name="bio" placeholder="e.g. Tracking severe weather across AL, MS, & OK">
                </div>
                <div class="mb-3">
                    <label class="form-label text-light small fw-bold">Profile Picture (PFP)</label>
                    <input type="file" class="form-control text-light" name="profile_pic" accept="image/*">
                </div>
                <button type="submit" class="btn btn-fb w-100 mb-3 py-2">Sign Up</button>
            </form>
            <div class="text-center">
                <p class="text-light small">Already have an account? <a href="{{ url_for('login') }}" class="fw-bold">Log in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
